version: '3.9'

services:
  datahub-gms:
    image: datahub/datahub-gms:v0.13.1
    container_name: kronika-datahub-gms
    ports:
      - "8080:8080"
    environment:
      - DATAHUB_GMS_PORT=8080
      - ELASTICSEARCH_HOST=localhost
      - ELASTICSEARCH_PORT=9200
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
