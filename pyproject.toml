[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "kronika"
version = "0.1.0"
requires-python = ">=3.12"
description = "Autonomous metadata decision engine for DataHub"


dependencies = []

[project.optional-dependencies]
application = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "aiohttp>=3.10",
    "jinja2>=3.1",
    "duckdb>=1.1",
    "networkx>=3.3",
    "openai>=1.40",
]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "hypothesis>=6.112",
    "import-linter>=2.1",
]
dev = [
    "kronika[application,test]",
    "ruff>=0.6",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kronika", "src/application"]

[tool.hatch.build.targets.wheel.sources]
"src" = ""

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
src = ["src"]
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = []

[tool.importlinter]
root_packages = ["kronika", "application"]

[[tool.importlinter.contracts]]
name = "kronika core must not import application layer"
type = "forbidden"
source_modules = ["kronika"]
forbidden_modules = [
    "application",
    "fastapi",
    "httpx",
    "aiohttp",
    "datahub",
    "openai",
    "networkx",
    "duckdb",
    "sqlalchemy",
]
